# =============================================================================
#  TP INF3611 — site de test (HTTP 80 + HTTPS 443 auto-signé)
#  Installé par install.sh dans /etc/nginx/sites-available/tp-lab
#  Racine : /var/www/tp-lab  — cert : /etc/ssl/tp-lab/
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name web.tp.local serveur.tp.local;
    root /var/www/tp-lab;

    location / {
        try_files $uri $uri/ =404;
        index index.html;
    }

    # fichier de 20 Mio pour les tests de transfert (curl / scp)
    location = /fichier-20m.bin {
        add_header Content-Type application/octet-stream always;
        add_header Accept-Ranges bytes always;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name web.tp.local serveur.tp.local;
    root /var/www/tp-lab;

    ssl_certificate     /etc/ssl/tp-lab/web.tp.local.crt;
    ssl_certificate_key /etc/ssl/tp-lab/web.tp.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        try_files $uri $uri/ =404;
        index index.html;
    }

    location = /fichier-20m.bin {
        add_header Content-Type application/octet-stream always;
    }
}
